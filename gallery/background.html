<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background — 2D Texture Gallery</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
nav a { background: #16213e; color: #a8a8b3; text-decoration: none; border: 1px solid #0f3460; padding: 8px 18px; border-radius: 8px; font-size: 14px; transition: all 0.2s; }
nav a:hover { background: #0f3460; color: #fff; }
nav a.active { background: #e94560; color: #fff; border-color: #e94560; }
.info { color: #888; font-size: 14px; margin-bottom: 12px; }
canvas { border-radius: 12px; background: #16213e; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: block; max-width: 100%; }
</style>
</head>
<body>
<nav>
  <a href="index.html">Главная</a>
  <a href="root.html">Root (4)</a>
  <a class="active" href="background.html">Background (10)</a>
  <a href="money.html">Money (1)</a>
  <a href="player.html">Player (16)</a>
  <a href="tiles.html">Tiles (15)</a>
</nav>
<div class="info">Background — 10 текстур</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CELL_PAD = 8;
const COLS = 4;
const images = [
  'Background1.png','Background2.png','Background3.png','Background4.png',
  'Background5.png','Background6.png','Background6-Sheet.png','Background7.png',
  'Background8.png','Background9.png'
];
const folder = '../assets/Background/';
function getW() { return Math.min(window.innerWidth - 32, 1200); }
function render() {
  const w = getW();
  const cw = (w - CELL_PAD*(COLS+1))/COLS;
  const ch = cw + 28;
  const rows = Math.ceil(images.length/COLS);
  canvas.width = w;
  canvas.height = rows*ch + CELL_PAD*(rows+1);
  ctx.clearRect(0,0,w,canvas.height);
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0,0,w,canvas.height);
  const imgs = [];
  let loaded = 0;
  images.forEach((path,i)=>{
    const img = new Image();
    img.onload = img.onerror = ()=>{
      imgs[i]=img.complete&&img.naturalWidth>0?img:null;
      if(++loaded===images.length) drawAll();
    };
    img.src = folder+encodeURI(path);
  });
  function drawAll(){
    imgs.forEach((img,i)=>{
      const col=i%COLS, row=Math.floor(i/COLS);
      const x=CELL_PAD+col*(cw+CELL_PAD), y=CELL_PAD+row*(ch+CELL_PAD);
      ctx.fillStyle='#1a1a3e';
      ctx.beginPath();
      ctx.roundRect(x,y,cw,ch,6);
      ctx.fill();
      ctx.fillStyle='#e94560';
      ctx.beginPath();
      ctx.arc(x+22,y+22,14,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 13px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(i+1,x+22,y+22);
      const ia=cw-16, ih=ch-28-16;
      if(img){
        const s=Math.min(ia/img.width,ih/img.height,2);
        ctx.drawImage(img,x+(cw-img.width*s)/2,y+40+(ih-img.height*s)/2,img.width*s,img.height*s);
      }
      ctx.fillStyle='#a8a8b3';
      ctx.font='11px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='bottom';
      ctx.fillText(path.split('/').pop(),x+cw/2,y+ch-6);
    });
  }
}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2; if(r>h/2)r=h/2;
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);
    return this;
  };
}
window.addEventListener('resize',render);
render();
</script>
</body>
</html>
